<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фургончик на CSS</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }

  body {
    background:
      repeating-linear-gradient(90deg, #fff 0 40px, transparent 40px 80px) left 0 bottom 42px / 100% 6px no-repeat,
      linear-gradient(#4a4a55, #4a4a55) left 0 bottom 0 / 100% 90px no-repeat,
      linear-gradient(#3d8b4f, #3d8b4f) left 0 bottom 90px / 100% 60px no-repeat,
      radial-gradient(circle at 20% calc(100% - 150px), #ffb347 0 55px, transparent 56px),
      linear-gradient(#5b4b8a, #ff9e6d);
  }

  body::before {
    content: "";
    position: fixed;
    left: 68%;
    bottom: 90px;
    width: 110px;
    height: 100px;
    background:
      linear-gradient(#5d4037, #5d4037) 50% 100% / 20px 32px no-repeat,
      linear-gradient(#ffe082, #ffe082) 12px 52px / 22px 22px no-repeat,
      linear-gradient(#ffe082, #ffe082) 76px 52px / 22px 22px no-repeat,
      linear-gradient(to top left, #a33 50%, transparent 50%) left top / 50% 40px no-repeat,
      linear-gradient(to top right, #a33 50%, transparent 50%) right top / 50% 40px no-repeat,
      linear-gradient(#e0c9a6, #e0c9a6) left bottom / 100% 60px no-repeat;
  }

  .car {
    position: absolute;
    left: 0;
    bottom: 64px;
    width: 200px;
    height: 56px;
    background:
      radial-gradient(circle at 193px 44px, #fff59d 0 5px, transparent 6px),
      linear-gradient(#c62828, #c62828) 0 38px / 100% 6px no-repeat,
      linear-gradient(#bfe9ff, #bfe9ff) 148px 8px / 38px 22px no-repeat,
      linear-gradient(#bfe9ff, #bfe9ff) 100px 8px / 36px 22px no-repeat,
      linear-gradient(#bfe9ff, #bfe9ff) 56px 8px / 36px 22px no-repeat,
      linear-gradient(#bfe9ff, #bfe9ff) 12px 8px / 36px 22px no-repeat,
      #ffca28;
    border-radius: 10px 22px 6px 6px;
    transform: translateX(-200px);
    animation: drive 4s ease-out forwards;
  }

  .car::before {
    content: "";
    position: absolute;
    left: 30px;
    top: -14px;
    width: 90px;
    height: 14px;
    background: #6d4c41;
    border-radius: 4px 4px 0 0;
  }

  .car::after {
    content: "";
    position: absolute;
    left: 25px;
    bottom: -16px;
    width: 36px;
    height: 36px;
    background: #222;
    border-radius: 50%;
    box-shadow: 110px 0 #222;
  }

  @keyframes drive {
    to { transform: translateX(calc(100vw - 250px)); }
  }
</style>
</head>
<body>
  <div class="car"></div>
</body>
</html>
